services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: ledger-postgres
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledger-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Ledger.Api/Dockerfile
    container_name: ledger-api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ledger;Username=ledger;Password=ledger
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: docker.io/apache/kafka:3.7.0
    container_name: ledger-kafka
    ports:
      - "9092:9092"
    environment:
      # ana: por que dois listeners e só um advertised? (dados vs controller quorum)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_HEAP_OPTS: -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: docker.io/dpage/pgadmin4
    container_name: ledger-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ana@ledger.local
      PGADMIN_DEFAULT_PASSWORD: ledger
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ledger-postgres-data:
