services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: ledger-postgres
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: docker.io/dpage/pgadmin4
    container_name: ledger-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ana@ledger.local
      PGADMIN_DEFAULT_PASSWORD: ledger
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
